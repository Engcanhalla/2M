<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 해솔중 2학년 영어 기말고사 모의고사</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#2563eb;--primary-light:#dbeafe;--success:#16a34a;--danger:#dc2626;--warning:#f59e0b;--bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--radius:12px}
body{font-family:'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:16px}
/* Start Screen */
.start-screen{text-align:center;padding:60px 20px}
.start-screen h1{font-size:1.8rem;margin-bottom:8px;color:var(--primary)}
.start-screen .subtitle{color:var(--muted);margin-bottom:32px;font-size:0.95rem}
.start-screen .info-box{background:var(--primary-light);border-radius:var(--radius);padding:20px;margin:20px 0;text-align:left;font-size:0.9rem;line-height:1.7}
.start-screen .info-box strong{color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 32px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#1d4ed8;transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.3)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#15803d}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary)}
.btn-outline:hover{background:var(--primary-light)}
.btn-sm{padding:8px 20px;font-size:.875rem}
/* Progress */
.progress-bar{background:var(--border);border-radius:99px;height:8px;margin:12px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#7c3aed);border-radius:99px;transition:width .4s ease}
.progress-text{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:4px}
/* Card */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);padding:24px;margin:16px 0;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.q-num{background:var(--primary);color:#fff;border-radius:99px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
.q-type{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600}
.q-type.d{background:#fef3c7;color:#92400e}
.q-type.p{background:#dbeafe;color:#1e40af}
.q-type.k{background:#fce7f3;color:#9d174d}
.q-type.g{background:#d1fae5;color:#065f46}
.q-pts{font-size:.75rem;color:var(--muted)}
.q-diff{font-size:.7rem;padding:2px 8px;border-radius:99px;font-weight:700}
.q-diff.low{background:#e0f2fe;color:#0369a1}
.q-diff.mid{background:#fef9c3;color:#a16207}
.q-diff.high{background:#fee2e2;color:#b91c1c}
.stem{font-size:.95rem;line-height:1.7;margin-bottom:16px;font-weight:500}
.passage{background:#f1f5f9;border-left:3px solid var(--primary);padding:14px 16px;margin-bottom:16px;font-size:.88rem;line-height:1.8;border-radius:0 8px 8px 0;white-space:pre-line;max-height:320px;overflow-y:auto}
.passage u{text-decoration:underline;text-decoration-color:var(--danger);text-underline-offset:3px}
/* Choices */
.choices{list-style:none;display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;font-size:.9rem;line-height:1.6}
.choice:hover{border-color:var(--primary);background:var(--primary-light)}
.choice.selected{border-color:var(--primary);background:var(--primary-light)}
.choice.correct{border-color:var(--success);background:#dcfce7}
.choice.wrong{border-color:var(--danger);background:#fee2e2}
.choice input{margin-top:4px;flex-shrink:0;accent-color:var(--primary)}
.choice-label{flex:1}
/* Nav */
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:8px}
.nav-row .btn{min-width:100px}
/* Q-map */
.q-map{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:12px 0}
.q-dot{width:100%;aspect-ratio:1;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;cursor:pointer;transition:all .15s}
.q-dot:hover{transform:scale(1.1)}
.q-dot.answered{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.q-dot.current{background:var(--primary);color:#fff;border-color:var(--primary)}
.q-dot.review-correct{background:#dcfce7;border-color:var(--success);color:var(--success)}
.q-dot.review-wrong{background:#fee2e2;border-color:var(--danger);color:var(--danger)}
/* Result */
.result-screen{text-align:center;padding:40px 20px}
.score-circle{width:160px;height:160px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px auto;font-size:2.5rem;font-weight:800;border:6px solid}
.score-circle.perfect{border-color:var(--warning);background:#fffbeb;color:var(--warning);animation:pulse 1s infinite}
.score-circle.great{border-color:var(--success);background:#f0fdf4;color:var(--success)}
.score-circle.good{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.score-circle.retry{border-color:var(--danger);background:#fef2f2;color:var(--danger)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.score-circle small{font-size:.8rem;font-weight:400}
.result-msg{font-size:1.1rem;margin:16px 0;line-height:1.6}
.result-detail{background:#f1f5f9;border-radius:var(--radius);padding:16px;margin:16px 0;text-align:left;font-size:.85rem;line-height:1.8}
.result-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
/* Review */
.review-card{border-left:4px solid var(--danger);margin-bottom:16px}
.review-card.is-correct{border-left-color:var(--success)}
.explanation{background:#fefce8;border-radius:8px;padding:12px;margin-top:12px;font-size:.85rem;line-height:1.6;color:#713f12}
/* Confetti */
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
/* Responsive */
@media(max-width:480px){
  .container{padding:10px}
  .card{padding:16px}
  .q-map{grid-template-columns:repeat(5,1fr)}
  .passage{font-size:.82rem;max-height:240px}
}
</style>
</head>
<body>
<div class="container" id="app"></div>
<canvas id="confetti-canvas"></canvas>

<script>
const QUESTIONS=[
// ===== D-type (Dialogue) =====
{id:"q001",num:1,type:"D-5",cat:"d",pts:2,diff:"low",stem:"다음 대화의 요지로 가장 적절한 것은?",passage:"B: What is that woman doing there?\nW: She is experiencing VR car racing.\nB: Could you explain more about it?\nW: With a VR device, you can be a car racer.\nB: That sounds fun. I'd like to try it.\nW: Then stand in line there.",choices:["VR 기기는 매우 비싸서 구입하기 어렵다.","자동차 경주는 위험하기 때문에 아이들은 할 수 없다.","VR 자동차 경주에서 우승하면 상품을 받을 수 있다.","VR 기술은 아직 개발 중이라 사용할 수 없다.","VR 기기를 사용하면 자동차 경주를 체험할 수 있다."],answers:[5],explanation:"VR 기기로 카레이서가 될 수 있다는 내용이 요지"},
{id:"q002",num:2,type:"D-1",cat:"d",pts:2,diff:"low",stem:"다음 대화에서 (A)~(D)를 순서에 맞게 배열한 것은?",passage:"G: I saw that your drone passed through the rings. That was cool!\n─────\n(A) G: Could you explain more about it?\n(B) M: Thanks. Do you want to try it?\n(C) G: I'd love to. How can I fly the drone?\n(D) M: You can use this controller.\n─────\nM: Press the green button, and the drone goes up.\nG: I see. What's next?\nM: Press the red button, and it goes down.\nG: It works! Thank you so much.",choices:["(A)-(B)-(C)-(D)","(B)-(C)-(D)-(A)","(C)-(B)-(A)-(D)","(B)-(A)-(D)-(C)","(D)-(A)-(C)-(B)"],answers:[2],explanation:"Thanks→시도 제안→좋아, 어떻게?→컨트롤러→더 설명해줘"},
{id:"q003",num:3,type:"D-4",cat:"d",pts:2,diff:"low",stem:"위 대화(드론)의 내용과 일치하는 것은?",passage:"",choices:["소녀는 드론을 조종한 경험이 있다.","드론을 올리려면 빨간 버튼을 눌러야 한다.","소년의 드론이 고리를 통과하는 것을 소녀가 보았다.","소녀가 소년에게 드론 조종법을 알려주었다.","드론을 조종하려면 특별한 앱이 필요하다."],answers:[3],explanation:"\"I saw that your drone passed through the rings.\""},
{id:"q004",num:4,type:"D-2",cat:"d",pts:2,diff:"low",stem:"다음 대화에서 <보기>의 문장이 들어가기에 가장 적절한 곳은?\n\n<보기> Reporter: How does it work? Could you explain more about it?",passage:"Reporter: Juwon, you won the special prize in the invention contest. Great job!\nⓐ\nJuwon: Thank you. I'm proud of my invention.\nⓑ\nReporter: What's your invention?\nⓒ\nJuwon: It's a recorder which doesn't bother other people.\nⓓ\nJuwon: I connected headphones to the recorder with a simple device. The device sends the sound from the recorder to the headphones.\nⓔ\nReporter: That's cool. When you wear the headphones, only you can hear the sound.\nJuwon: Right. People can play the recorder any time. I'm sure that this invention will be very helpful.",choices:["ⓐ","ⓑ","ⓒ","ⓓ","ⓔ"],answers:[4],explanation:"발명품 설명 후 '어떻게 작동하나요?'가 자연스러움"},
{id:"q005",num:5,type:"D-5",cat:"d",pts:2,diff:"low",stem:"위 대화(발명 인터뷰)의 요지로 가장 적절한 것은?",passage:"",choices:["Juwon은 발명 대회에서 실패했지만 다시 도전할 것이다.","Juwon은 헤드폰을 이용하여 음악을 작곡하였다.","리코더와 헤드폰을 함께 사면 가격이 더 저렴하다.","Juwon은 다른 사람을 방해하지 않는 리코더를 발명했다.","Juwon은 발명 대회의 심사위원이 되고 싶어 한다."],answers:[4],explanation:"헤드폰 연결하여 다른 사람을 방해하지 않는 리코더 발명"},
{id:"q006",num:6,type:"D-6",cat:"d",pts:2,diff:"low",stem:"다음 대화의 빈칸에 들어갈 말로 가장 적절한 것은?",passage:"B: Excuse me. How can I get to Times Square?\nW: Pardon?\nB: I'm trying to find Times Square. Can you please help me?\nW: Ah, I got it. ______________________\nB: Go straight this way and turn left?\nW: Right. You can't miss it.",choices:["Go straight this way and turn left.","I don't know this area very well.","Times Square is closed today.","You should take the subway instead.","Turn right at the first traffic light."],answers:[1],explanation:"B가 되묻는 내용과 일치"},
{id:"q007",num:7,type:"D-1",cat:"d",pts:2,diff:"low",stem:"다음 대화에서 (A)~(D)를 순서에 맞게 배열한 것은?",passage:"Mia: Ben, I can't believe we're in New York!\nBen: Yeah. This is my first time here.\n─────\n(A) Ben: The Statue of Liberty. You know the big green statue of a woman.\n(B) Mia: Me, too. There are many places to visit. Where should we start?\n(C) Ben: How about the Statue of Liberty?\n(D) Mia: Pardon?\n─────\nMia: Of course. It's a landmark of New York. Let's visit there first.\nBen: Good. After that, maybe we can go to the Empire State Building. It's famous for the fantastic view.\nMia: That sounds great!",choices:["(A)-(B)-(C)-(D)","(A)-(D)-(C)-(B)","(B)-(C)-(D)-(A)","(C)-(B)-(A)-(D)","(D)-(A)-(B)-(C)"],answers:[3],explanation:"어디부터→자유의 여신상 어때→뭐라고?→설명"},
// ===== K-type from Dialogues =====
{id:"q008",num:8,type:"K-5",cat:"k",pts:2,diff:"low",stem:"다음 대화에서 밑줄 친 \"sharper\"의 한글 뜻으로 가장 적절한 것은?",passage:"B: Look! People are trying to fly air rockets!\nG: Which rocket will go the highest?\nB: I'm sure that the red rocket will go the highest.\nG: Why do you think so?\nB: Its head looks different.\nG: Oh, you're right! The red rocket is <u>sharper</u> than the other rockets.",choices:["더 빠른","더 뾰족한","더 무거운","더 선명한","더 큰"],answers:[2],explanation:"로켓 머리 모양 맥락에서 sharp = 뾰족한"},
{id:"q009",num:9,type:"K-1",cat:"k",pts:2,diff:"low",stem:"다음 대화에서 밑줄 친 문장의 한글 해석으로 가장 적절한 것은?",passage:"Juwon: <u>It's a recorder which doesn't bother other people.</u>",choices:["그것은 다른 사람들을 방해하지 않는 리코더이다.","그것은 다른 사람들을 방해하는 리코더이다.","그것은 다른 사람들이 방해할 수 없는 리코더이다.","그것은 다른 사람들에게 도움이 되는 리코더이다.","그것은 다른 사람들을 즐겁게 하지 않는 리코더이다."],answers:[1],explanation:"함정: ②부정반전(수법3), ③주어-목적어 뒤바꿈(수법2), ④동사교체(수법1)"},
{id:"q010",num:10,type:"K-5",cat:"k",pts:2,diff:"low",stem:"다음 대화에서 밑줄 친 \"unique\"의 한글 뜻으로 가장 적절한 것은?",passage:"M: I said a pretzel. It is a salty type of bread with a <u>unique</u> shape.",choices:["평범한","거대한","단순한","불규칙한","독특한"],answers:[5],explanation:"unique = 고유한, 독특한"},
{id:"q011",num:11,type:"K-3",cat:"k",pts:2,diff:"low",stem:"다음 대화에서 밑줄 친 문장이 의미하는 바로 가장 적절한 것은?",passage:"W: How about watching Cats? <u>I heard the performances are amazing.</u>",choices:["고양이가 출연하는 영화가 있다고 들었다.","Cats 뮤지컬의 표를 이미 예매했다고 들었다.","Cats 공연이 오늘 취소되었다고 들었다.","Cats 뮤지컬의 공연이 훌륭하다고 들었다.","뮤지컬보다 연극이 더 재미있다고 들었다."],answers:[4],explanation:"performances = 공연, amazing = 훌륭한"},
{id:"q012",num:12,type:"K-4",cat:"k",pts:2,diff:"low",stem:"다음 대화(뉴욕 관광)의 내용과 일치하는 것은?",passage:"",choices:["Mia는 뉴욕에 여러 번 가본 적이 있다.","Ben은 자유의 여신상을 먼저 방문하자고 제안했다.","자유의 여신상은 파란색 남성 동상이다.","엠파이어 스테이트 빌딩은 맛있는 음식으로 유명하다.","Mia는 엠파이어 스테이트 빌딩에 가는 것을 거절했다."],answers:[2],explanation:"함정: ③'big green statue of a woman'→'파란색 남성 동상'(수법5)"},
// ===== P-type: Eiffel Tower =====
{id:"q013",num:13,type:"P-4",cat:"p",pts:2,diff:"low",stem:"다음 글의 내용과 일치하는 것은?",passage:"Welcome to my science quiz show! I'm Isabel. Here is the first question. I'm sure that you can find the right answer. The Eiffel Tower gets taller during the summer. Is this true or false? 3, 2, 1. The answer is true! The Eiffel Tower is 330 m. In summer, the temperature of the Eiffel Tower goes up. When the metal gets hot, it becomes bigger. So, the height of the tower becomes about 15 cm taller. In winter, the metal cools down, and the height of the tower becomes shorter. Now, let's answer another question together!",choices:["에펠탑은 겨울에 높이가 높아진다.","에펠탑의 높이는 약 300m이다.","금속이 뜨거워지면 크기가 작아진다.","여름에 에펠탑의 온도가 올라가면 높이가 약 15cm 높아진다.","Isabel은 마지막 질문을 출제하고 있다."],answers:[4],explanation:"'the height of the tower becomes about 15 cm taller'"},
{id:"q014",num:14,type:"P-5",cat:"p",pts:2,diff:"low",stem:"위 글(에펠탑)의 내용과 일치하지 않는 것은?",passage:"",choices:["에펠탑은 여름에 더 높아진다.","에펠탑의 높이는 330m이다.","금속은 열을 받으면 팽창한다.","겨울에는 금속이 식어 탑의 높이가 줄어든다.","여름에 에펠탑의 높이는 약 15m 높아진다."],answers:[5],explanation:"15cm → 15m 오류 (수법7: 범위/정도 미세 변경)"},
{id:"q015",num:15,type:"P-9",cat:"p",pts:2,diff:"low",stem:"위 글의 내용으로 보아, 빈칸에 들어갈 말로 가장 적절한 것은?\n\n\"The Eiffel Tower changes its height because ________.\"",passage:"",choices:["it is painted every summer and winter","engineers add new parts in the summer","the ground under the tower moves seasonally","metal expands and contracts with temperature changes","tourists make it heavier in the summer"],answers:[4],explanation:"금속이 열팽창·수축하여 높이가 변한다"},
// ===== P-type: Three Inventions =====
{id:"q016",num:16,type:"P-1",cat:"p",pts:2,diff:"low",stem:"다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 틀린 것은?",passage:"In America, there was a famous cook, Ms. Wakefield. One day in 1938, she wanted to bake chocolate cookies. However, she didn't have enough time ⓐ<u>to melt</u> chocolate. So, she cut a chocolate bar into small chips. Then, she ⓑ<u>mixed</u> them with her dough and ⓒ<u>putting</u> the cookie dough into the oven. When Ms. Wakefield opened the oven, she found that the chips ⓓ<u>were not melted</u> into the dough. Although the chips remained in the cookies, she was not ⓔ<u>disappointed</u>.",choices:["ⓐ","ⓑ","ⓒ","ⓓ","ⓔ"],answers:[3],explanation:"and 병렬구조 — mixed... and put이 맞음 (putting → put)"},
{id:"q017",num:17,type:"P-4",cat:"p",pts:2,diff:"low",stem:"위 글(Chocolate Chip Cookies)의 내용과 일치하는 것은?",passage:"",choices:["Ms. Wakefield는 1928년에 초콜릿 칩 쿠키를 만들었다.","Ms. Wakefield는 초콜릿을 완전히 녹여서 반죽에 넣었다.","초콜릿 칩은 오븐에서 반죽 속으로 완전히 녹아들었다.","Ms. Wakefield는 초콜릿을 녹일 시간이 충분하지 않았다.","Ms. Wakefield는 새 쿠키의 맛에 실망했다."],answers:[4],explanation:"'she didn't have enough time to melt chocolate'"},
{id:"q018",num:18,type:"P-3",cat:"p",pts:2,diff:"low",stem:"다음 글의 (A), (B), (C)의 네모 안에서 문맥에 맞는 낱말로 가장 적절한 것은?",passage:"In 1903, a French scientist, Mr. Bénédictus, was experimenting with liquid plastic in a glass flask. He (A)[accidentally / purposely] hit the glass flask, and it fell on the floor. (B)[Although / Because] the glass flask was broken into pieces, they still held together in the shape of the flask! How could this happen? The secret was the liquid plastic in the flask. This finding led to his (C)[invention / prevention] of safety glass.",choices:["accidentally — Although — invention","accidentally — Because — invention","purposely — Although — prevention","accidentally — Because — prevention","purposely — Because — invention"],answers:[1],explanation:"우연히(accidentally) + 비록~이지만(Although) + 발명(invention)"},
{id:"q019",num:19,type:"P-6",cat:"p",pts:2,diff:"low",stem:"주어진 글 (A)에 이어질 내용을 순서에 맞게 배열한 것은?",passage:"(A) In 1903, a French scientist, Mr. Bénédictus, was experimenting with liquid plastic in a glass flask.\n\n(B) How could this happen? The secret was the liquid plastic in the flask.\n\n(C) He accidentally hit the glass flask, and it fell on the floor.\n\n(D) Although the glass flask was broken into pieces, they still held together in the shape of the flask!",choices:["(B)-(C)-(D)","(B)-(D)-(C)","(C)-(B)-(D)","(C)-(D)-(B)","(D)-(B)-(C)"],answers:[4],explanation:"실험 중→부딪힘(C)→형태유지(D)→비밀은 액체 플라스틱(B)"},
{id:"q020",num:20,type:"P-13",cat:"p",pts:2,diff:"low",stem:"다음 글에서 <보기>의 문장이 들어가기에 가장 적절한 곳은?\n\n<보기> The dirty spot on the tablecloth was cleaned by the lamp oil!",passage:"Can you clean your clothes without water? The answer is \"yes.\" ⓐ Dry cleaning uses oil to clean clothes. ⓑ There's an interesting story about dry cleaning. In the 1800s, a factory worker in France spilled lamp oil on a tablecloth. ⓒ The factory manager, Mr. Jolly, looked at the tablecloth and found something. ⓓ His discovery led to a new way of cleaning clothes. ⓔ Now, dry cleaning is widely used around the world.",choices:["ⓐ","ⓑ","ⓒ","ⓓ","ⓔ"],answers:[4],explanation:"'found something' 다음에 발견 내용→이 발견이 새로운 방법으로"},
{id:"q021",num:21,type:"P-8",cat:"p",pts:2,diff:"low",stem:"다음 글의 ⓐ~ⓔ 중 전체 흐름과 관계 없는 문장은?",passage:"These days, we can find safety glass everywhere. ⓐ For example, it is used for car windows. ⓑ If there is a car accident, people are safer from sharp pieces of glass. ⓒ France is also famous for its beautiful art museums and historical buildings. ⓓ These wonderful inventions came by chance. ⓔ When things go wrong, don't be disappointed.",choices:["ⓐ","ⓑ","ⓒ","ⓓ","ⓔ"],answers:[3],explanation:"프랑스 미술관 이야기는 발명 흐름과 무관"},
{id:"q022",num:22,type:"P-15",cat:"p",pts:2,diff:"low",stem:"다음 글의 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",passage:"(A) _______ the chips remained in the cookies, she was not disappointed. Her new cookies were so delicious.\n...\nHis discovery led to a new way of cleaning clothes. (B) _______, dry cleaning is widely used around the world.",choices:["Although — Now","Because — Now","Although — However","Because — However","If — Therefore"],answers:[1],explanation:"(A) 양보 접속사 although, (B) 현재 상황 now"},
{id:"q023",num:23,type:"K-2",cat:"k",pts:2,diff:"low",stem:"위 글에서 밑줄 친 문장의 한글 해석으로 적절하지 않은 것은?",passage:"<u>Although the chips remained in the cookies, she was not disappointed.</u>",choices:["비록 칩들이 쿠키 안에 남아 있었지만, 그녀는 실망하지 않았다.","칩들이 쿠키에 그대로 남아 있었음에도, 그녀는 실망하지 않았다.","비록 칩들이 쿠키 속에 남아 있었으나, 그녀는 좌절하지 않았다.","칩들이 쿠키에서 녹아 없어졌지만, 그녀는 실망하지 않았다.","비록 칩들이 쿠키 안에 남아 있었지만, 그녀는 낙담하지 않았다."],answers:[4],explanation:"함정: 'remained(남아있었다)'→'녹아 없어졌다' (수법1: 핵심동사 교체)"},
{id:"q024",num:24,type:"G-2",cat:"g",pts:2,diff:"low",stem:"다음 문장과 같은 의미인 것은?\n\nAlthough the glass flask was broken into pieces, they still held together in the shape of the flask.",passage:"",choices:["The glass flask was broken into pieces, so they held together.","The glass flask was broken into pieces because they held together.","The glass flask was broken into pieces, but they still held together.","The glass flask was broken into pieces, and they fell apart.","Because the glass flask was broken, they could not hold together."],answers:[3],explanation:"although = but (양보→역접 전환)"},

{id:"q027",num:27,type:"G-1",cat:"g",pts:2,diff:"low",stem:"다음 능동태 문장을 수동태로 바꾼 것으로 가장 적절한 것은?\n\nThe lamp oil cleaned the dirty spot on the tablecloth.",passage:"",choices:["The dirty spot on the tablecloth cleaned by the lamp oil.","The dirty spot on the tablecloth is cleaned by the lamp oil.","The dirty spot on the tablecloth was cleaned by the lamp oil.","The dirty spot on the tablecloth was cleaning by the lamp oil.","The dirty spot on the tablecloth has cleaned by the lamp oil."],answers:[3],explanation:"과거 능동태→was+p.p.+by+행위자"},

{id:"q028",num:28,type:"P-1",cat:"p",pts:2,diff:"low",stem:"다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 틀린 것은?",passage:"Hula is a traditional dance from Hawaii, and it ⓐ<u>has been</u> a part of Hawaiian life for a long time. The early Hawaiians didn't have a writing system, so they ⓑ<u>used</u> hula to tell stories. Hula is a language through body movements, and it has ⓒ<u>passed</u> down stories from one generation to the next. Now it's time to dance! Remember that you ⓓ<u>become</u> a storyteller when you dance hula. You tell a story with your hands, feet, and hips. Oh, you need ⓔ<u>taking</u> off your shoes and socks!",choices:["ⓐ","ⓑ","ⓒ","ⓓ","ⓔ"],answers:[5],explanation:"need+to부정사 → need to take off (taking→to take)"},
{id:"q029",num:29,type:"P-3",cat:"p",pts:2,diff:"low",stem:"다음 글의 (A),(B),(C) 네모 안에서 문맥에 맞는 낱말로 가장 적절한 것은?",passage:"Every gesture in hula has a (A)[meaning / rhythm]. Wave your fingers while you move your arms up and down. This gesture is called ua in the Hawaiian language, and it means \"rain.\" What about the sun? Hawaiians make a circle with their arms (B)[above / below] their heads. That's ka lā, the \"sun.\" These gestures are so (C)[simple / difficult] that you can easily remember them.",choices:["meaning — above — simple","meaning — below — simple","rhythm — above — difficult","meaning — above — difficult","rhythm — below — simple"],answers:[1],explanation:"의미(meaning)+머리 위(above)+간단한(simple)"},
{id:"q030",num:30,type:"P-6",cat:"p",pts:2,diff:"low",stem:"주어진 글 (A)에 이어질 내용을 순서에 맞게 배열한 것은?",passage:"(A) Let's start with the hand gestures.\n\n(B) This gesture is called ua in the Hawaiian language, and it means \"rain.\"\n\n(C) Every gesture in hula has a meaning.\n\n(D) Wave your fingers while you move your arms up and down.",choices:["(B)-(C)-(D)","(B)-(D)-(C)","(C)-(D)-(B)","(D)-(B)-(C)","(D)-(C)-(B)"],answers:[3],explanation:"손동작 시작(A)→의미 있다(C)→흔들어라(D)→이것이 ua, 비(B)"},

{id:"q050",num:50,type:"P-19",cat:"p",pts:2,diff:"low",stem:"위 글(3가지 발명)의 마지막 문장 빈칸에 들어갈 말로 가장 적절한 것은?\n\nWhen things go wrong, don't be disappointed. Maybe you can be the next amazing _______.",passage:"",choices:["teacher","scientist","inventor","artist","athlete"],answers:[3],explanation:"본문 마지막 문장 'the next amazing inventor'"}
];

// ===== APP STATE =====
let state={screen:"start",currentQ:0,userAnswers:{},score:0,wrongIds:[],retryMode:null,attempt:1};
const app=document.getElementById("app");
const totalPts=QUESTIONS.reduce((s,q)=>s+q.pts,0);

function render(){
  switch(state.screen){
    case"start":renderStart();break;
    case"quiz":renderQuiz();break;
    case"result":renderResult();break;
    case"review":renderReview();break;
  }
}

// ===== START SCREEN =====
function renderStart(){
  const diffCounts={low:0,mid:0,high:0};
  QUESTIONS.forEach(q=>diffCounts[q.diff]++);
  app.innerHTML=`
  <div class="start-screen">
    <h1>2026 해솔중 2학년 영어 기말고사</h1>
    <p class="subtitle">모의고사 카드형 문제풀이</p>
    <div class="info-box">
      <strong>총 ${QUESTIONS.length}문제</strong> | 만점 <strong>${totalPts}점</strong> (각 2점)<br><br>
      <strong>난이도 [하]</strong> ${diffCounts.low}문제 — 정답 1개 선택<br>
      <strong>난이도 [중]</strong> ${diffCounts.mid}문제 — 복수 정답, 개수 공개<br>
      <strong>난이도 [상]</strong> ${diffCounts.high}문제 — 복수 정답, 개수 비공개<br><br>
      <strong>채점 규칙:</strong><br>
      100점 — 축하 축포!<br>
      90점대 — 틀린 문제만 재도전<br>
      80점대 — 전체 다시 풀기<br>
      80점 미만 — 오답 복습 후 전체 재도전
    </div>
    <button class="btn btn-primary" onclick="startQuiz()" style="font-size:1.1rem;padding:16px 48px">시작하기</button>
  </div>`;
}

function startQuiz(){
  state={screen:"quiz",currentQ:0,userAnswers:{},score:0,wrongIds:[],retryMode:state.retryMode,attempt:state.attempt};
  render();
}

// ===== QUIZ SCREEN =====
function renderQuiz(){
  const qs=getActiveQuestions();
  const q=qs[state.currentQ];
  const total=qs.length;
  const answered=Object.keys(state.userAnswers).length;
  const pct=Math.round((state.currentQ/total)*100);
  const isMulti=q.diff==="mid"||q.diff==="high";
  const sel=state.userAnswers[q.id]||[];

  const diffLabel=q.diff==="low"?"하":q.diff==="mid"?"중":"상";
  const diffHint=q.diff==="mid"?` (정답 ${q.answerCount||q.answers.length}개를 고르시오)`
    :q.diff==="high"?" (있는 대로 고르시오)":"";
  const catLabel={d:"대화문",p:"지문",k:"한글해석",g:"문법"}[q.cat];

  app.innerHTML=`
  <div class="progress-text"><span>${state.currentQ+1} / ${total}</span><span>${answered}문제 완료</span></div>
  <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  <div class="q-map">${qs.map((qq,i)=>{
    let cls="q-dot";
    if(i===state.currentQ)cls+=" current";
    else if(state.userAnswers[qq.id])cls+=" answered";
    return`<div class="${cls}" onclick="goTo(${i})">${i+1}</div>`;
  }).join("")}</div>
  <div class="card">
    <div class="q-header">
      <div class="q-num">${q.num}</div>
      <span class="q-type ${q.cat}">${q.type} ${catLabel}</span>
      <span class="q-pts">${q.pts}점</span>
      <span class="q-diff ${q.diff==='low'?'low':q.diff==='mid'?'mid':'high'}">난이도 ${diffLabel}</span>
    </div>
    <div class="stem">${q.stem.replace(/\n/g,"<br>")}${diffHint}</div>
    ${q.passage?`<div class="passage">${q.passage}</div>`:""}
    <ul class="choices">${q.choices.map((c,i)=>{
      const num=i+1;
      const checked=sel.includes(num);
      const inputType=isMulti?"checkbox":"radio";
      return`<li class="choice${checked?" selected":""}" onclick="selectChoice(${num},${isMulti})">
        <input type="${inputType}" name="q${q.id}" ${checked?"checked":""}>
        <span class="choice-label">${"①②③④⑤"[i]} ${c}</span>
      </li>`;
    }).join("")}</ul>
  </div>
  <div class="nav-row">
    <button class="btn btn-outline btn-sm" ${state.currentQ===0?"disabled":""} onclick="goTo(${state.currentQ-1})">&#9664; 이전</button>
    <span style="font-size:.8rem;color:var(--muted)">${answered}/${total} 완료</span>
    ${state.currentQ===total-1?
      `<button class="btn btn-success btn-sm" onclick="submitQuiz()" ${answered<total?'title="모든 문제를 풀어주세요"':""}>제출하기</button>`
      :`<button class="btn btn-primary btn-sm" onclick="goTo(${state.currentQ+1})">다음 &#9654;</button>`}
  </div>`;
}

function selectChoice(num,isMulti){
  const qs=getActiveQuestions();
  const q=qs[state.currentQ];
  let sel=state.userAnswers[q.id]||[];
  if(isMulti){
    if(sel.includes(num))sel=sel.filter(n=>n!==num);
    else sel=[...sel,num];
  }else{
    sel=[num];
  }
  state.userAnswers[q.id]=sel;
  render();
}

function goTo(i){
  const qs=getActiveQuestions();
  if(i>=0&&i<qs.length){state.currentQ=i;render()}
}

function getActiveQuestions(){
  if(state.retryMode==="wrong"){
    return QUESTIONS.filter(q=>state.wrongIds.includes(q.id));
  }
  return QUESTIONS;
}

// ===== SUBMIT =====
function submitQuiz(){
  const qs=getActiveQuestions();
  const unanswered=qs.filter(q=>!state.userAnswers[q.id]||state.userAnswers[q.id].length===0);
  if(unanswered.length>0){
    if(!confirm(`아직 ${unanswered.length}문제를 풀지 않았습니다.\n그래도 제출하시겠습니까?`))return;
  }
  // Score
  let correct=0,wrong=[];
  qs.forEach(q=>{
    const sel=(state.userAnswers[q.id]||[]).sort().join(",");
    const ans=q.answers.sort().join(",");
    if(sel===ans)correct+=q.pts;
    else wrong.push(q.id);
  });
  state.score=correct;
  state.wrongIds=wrong;
  state.screen="result";
  render();
  if(correct>=totalPts)launchConfetti();
}

// ===== RESULT SCREEN =====
function renderResult(){
  const qs=getActiveQuestions();
  const maxPts=qs.reduce((s,q)=>s+q.pts,0);
  const pct=Math.round((state.score/totalPts)*100);
  const wrongCount=state.wrongIds.length;
  const correctCount=qs.length-wrongCount;
  let cls,msg,btns;

  if(state.score>=totalPts){
    cls="perfect";msg="<b>PERFECT!</b> 만점입니다!<br>대단해요, 정말 완벽합니다!";
    btns=`<button class="btn btn-primary" onclick="resetAll()">처음부터 다시</button>`;
  }else if(pct>=90){
    cls="great";msg=`훌륭합니다! ${pct}점!<br>틀린 ${wrongCount}문제만 다시 풀어보세요.`;
    btns=`<button class="btn btn-success" onclick="retryWrong()">틀린 문제 재도전</button>
      <button class="btn btn-outline" onclick="showReview()">오답 복습</button>`;
  }else if(pct>=80){
    cls="good";msg=`잘했어요! ${pct}점!<br>전체 문제를 다시 풀어보세요.`;
    btns=`<button class="btn btn-primary" onclick="retryAll()">전체 재도전</button>
      <button class="btn btn-outline" onclick="showReview()">오답 복습</button>`;
  }else{
    cls="retry";msg=`${pct}점입니다.<br>오답을 복습한 후 다시 도전해보세요!`;
    btns=`<button class="btn btn-danger" onclick="showReview()">오답 복습하기</button>
      <button class="btn btn-outline" onclick="retryAll()">전체 재도전</button>`;
  }

  app.innerHTML=`
  <div class="result-screen">
    <h2 style="margin-bottom:8px">${state.attempt>1?`${state.attempt}차 `:""} 채점 결과</h2>
    <div class="score-circle ${cls}"><span>${state.score}</span><small>/ ${totalPts}점</small></div>
    <div class="result-msg">${msg}</div>
    <div class="result-detail">
      <b>정답:</b> ${correctCount}문제 / <b>오답:</b> ${wrongCount}문제<br>
      <b>정답률:</b> ${pct}%<br>
      ${wrongCount>0?`<b>틀린 문제:</b> ${state.wrongIds.map(id=>{const q=QUESTIONS.find(x=>x.id===id);return q?q.num:"";}).join(", ")}번`:""}
    </div>
    <div class="result-btns">${btns}</div>
  </div>`;
}

function retryWrong(){
  state.retryMode="wrong";state.attempt++;state.screen="quiz";state.currentQ=0;state.userAnswers={};render();
}
function retryAll(){
  state.retryMode=null;state.attempt++;state.screen="quiz";state.currentQ=0;state.userAnswers={};state.wrongIds=[];render();
}
function resetAll(){
  state={screen:"start",currentQ:0,userAnswers:{},score:0,wrongIds:[],retryMode:null,attempt:1};render();
}
function showReview(){state.screen="review";render()}

// ===== REVIEW SCREEN =====
function renderReview(){
  const wrongQs=QUESTIONS.filter(q=>state.wrongIds.includes(q.id));
  app.innerHTML=`
  <div style="padding:8px 0">
    <h2 style="margin-bottom:4px">오답 복습 (${wrongQs.length}문제)</h2>
    <p style="color:var(--muted);font-size:.85rem;margin-bottom:16px">각 문제의 정답과 해설을 확인하세요.</p>
    ${wrongQs.map(q=>{
      const sel=state.userAnswers[q.id]||[];
      return`<div class="card review-card">
        <div class="q-header">
          <div class="q-num">${q.num}</div>
          <span class="q-type ${q.cat}">${q.type}</span>
          <span class="q-pts">${q.pts}점</span>
        </div>
        <div class="stem">${q.stem.replace(/\n/g,"<br>")}</div>
        ${q.passage?`<div class="passage">${q.passage}</div>`:""}
        <ul class="choices">${q.choices.map((c,i)=>{
          const num=i+1;
          const isCorrect=q.answers.includes(num);
          const wasSelected=sel.includes(num);
          let cls="choice";
          if(isCorrect)cls+=" correct";
          else if(wasSelected)cls+=" wrong";
          return`<li class="${cls}">
            <span class="choice-label">${"①②③④⑤"[i]} ${c} ${isCorrect?"<b>✓ 정답</b>":""}${wasSelected&&!isCorrect?"<b>✗ 내 선택</b>":""}</span>
          </li>`;
        }).join("")}</ul>
        <div class="explanation"><b>해설:</b> ${q.explanation}</div>
      </div>`;
    }).join("")}
    <div class="nav-row" style="justify-content:center;gap:12px;padding-bottom:40px">
      ${state.score>=90?`<button class="btn btn-success" onclick="retryWrong()">틀린 문제 재도전</button>`
        :`<button class="btn btn-primary" onclick="retryAll()">전체 재도전</button>`}
      <button class="btn btn-outline" onclick="state.screen='result';render()">결과로 돌아가기</button>
    </div>
  </div>`;
}

// ===== CONFETTI =====
function launchConfetti(){
  playFanfare();
  const canvas=document.getElementById("confetti-canvas");
  const ctx=canvas.getContext("2d");
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const particles=[];
  const colors=["#ff0","#f00","#0f0","#00f","#f0f","#0ff","#ff6b00","#e91e63","#9c27b0","#4caf50"];
  for(let i=0;i<300;i++){
    particles.push({
      x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,
      vx:(Math.random()-.5)*8,vy:Math.random()*4+2,
      w:Math.random()*10+4,h:Math.random()*6+2,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,rotV:(Math.random()-.5)*10,
      life:1
    });
  }
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    particles.forEach(p=>{
      if(p.life<=0)return;
      alive=true;
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.rot+=p.rotV;
      if(p.y>canvas.height+20)p.life=0;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
      if(frame>120)p.life-=0.008;
    });
    frame++;
    if(alive)requestAnimationFrame(draw);
    else{ctx.clearRect(0,0,canvas.width,canvas.height)}
  }
  draw();
}

function playFanfare(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const notes=[523.25,659.25,783.99,1046.5];
    notes.forEach((freq,i)=>{
      const osc=ac.createOscillator();const gain=ac.createGain();
      osc.type="triangle";osc.frequency.value=freq;
      gain.gain.setValueAtTime(0.3,ac.currentTime+i*0.2);
      gain.gain.exponentialRampToValueAtTime(0.01,ac.currentTime+i*0.2+0.8);
      osc.connect(gain);gain.connect(ac.destination);
      osc.start(ac.currentTime+i*0.2);osc.stop(ac.currentTime+i*0.2+0.8);
    });
  }catch(e){}
}

render();
</script>
