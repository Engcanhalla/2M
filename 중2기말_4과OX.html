<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#2e1065 0%,#4c1d95 60%,#1e1b4b 100%);min-height:100vh;min-height:-webkit-fill-available;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(80px,env(safe-area-inset-bottom));display:flex;align-items:flex-start;justify-content:center;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;touch-action:pan-y}
.wrap{max-width:520px;width:100%;background:#f8fafc;border-radius:28px;box-shadow:0 24px 64px rgba(0,0,0,.35);overflow:hidden}
.header{background:linear-gradient(150deg,#2e1065 0%,#4c1d95 60%,#1e1b4b 100%);padding:24px 20px 18px;color:#fff;text-align:center;position:-webkit-sticky;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.header h1{font-size:1.15rem;font-weight:700;margin-bottom:3px;letter-spacing:-.02em}
.header p{opacity:.7;font-size:.8rem}
.content{padding:20px 18px 40px}
.prog-bar{height:8px;background:#e2e8f0;border-radius:4px;margin-bottom:14px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#a78bfa);border-radius:4px;transition:width .4s}
.q-counter{text-align:center;font-size:.82rem;color:#64748b;margin-bottom:6px;font-weight:500}
.title-box{text-align:center;margin:10px 0 14px;padding:18px 16px;background:linear-gradient(135deg,#faf5ff,#f3e8ff);border-radius:18px;border:2px solid #c4b5fd}
.title-box .ptitle{font-size:1.55rem;font-weight:800;color:#5b21b6;letter-spacing:-.02em;line-height:1.2}
.title-box .tlabel{display:inline-block;margin-top:6px;font-size:.72rem;background:#ede9fe;color:#6d28d9;padding:3px 10px;border-radius:20px;font-weight:700}
.statement{margin:14px 0;padding:16px 18px;background:#fff;border:1.5px solid #e8ecf1;border-radius:14px;font-size:1rem;color:#1e293b;line-height:1.65;font-weight:500;box-shadow:0 1px 4px rgba(15,23,42,.06)}
.source-box{margin:10px 0 4px;padding:12px 14px;background:#f9fafb;border-left:3px solid #a78bfa;border-radius:0 10px 10px 0;font-size:.82rem;color:#4b5563;line-height:1.65;font-style:italic}
.source-label{display:block;font-size:.68rem;color:#7c3aed;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-style:normal}
.ox-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ox-btn{padding:18px 10px;border:2px solid #e5e7eb;background:#fff;border-radius:16px;font-size:1rem;font-weight:800;color:#1e293b;cursor:pointer;font-family:inherit;transition:all .18s;touch-action:manipulation;-webkit-user-select:none;user-select:none;min-height:84px}
.ox-btn:active{transform:scale(.96)}
.ox-btn.o{color:#059669}
.ox-btn.x{color:#dc2626}
.ox-btn.dunno{grid-column:1 / span 2;padding:14px;font-size:.92rem;color:#64748b;font-weight:700;min-height:0}
.ox-btn.sel.o{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#10b981}
.ox-btn.sel.x{background:linear-gradient(135deg,#fff1f2,#fecdd3);border-color:#ef4444}
.ox-btn.sel.dunno{background:#f1f5f9;border-color:#94a3b8}
.ox-btn.correct{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#10b981;color:#065f46}
.ox-btn.wrong{background:linear-gradient(135deg,#fff1f2,#fecdd3);border-color:#ef4444;color:#7f1d1d}
.ox-btn[disabled]{cursor:default;opacity:.85}
.ox-icon{display:block;font-size:1.6rem;margin-bottom:4px}
.fb{text-align:center;padding:14px 16px;border-radius:14px;margin-top:14px;font-weight:700;font-size:.92rem;line-height:1.5}
.fb.ok{background:linear-gradient(135deg,#ecfdf5,#d1fae5);color:#065f46;border:1.5px solid #6ee7b7}
.fb.ng{background:linear-gradient(135deg,#fff1f2,#fecdd3);color:#881337;border:1.5px solid #fda4af}
.fb.dunno{background:#f1f5f9;color:#475569;border:1.5px solid #cbd5e1}
.explain-box{margin-top:10px;padding:14px;background:#fff;border-radius:12px;border:1.5px solid #e8ecf1}
.ex-title{font-size:.82rem;font-weight:800;color:#6d28d9;margin-bottom:8px;padding-bottom:6px;border-bottom:1.5px solid #f1f5f9}
.ex-body{font-size:.88rem;color:#374151;line-height:1.75}
.ex-answer{display:inline-block;font-size:.95rem;font-weight:900;padding:2px 14px;border-radius:20px;margin-right:8px;vertical-align:middle}
.ex-answer.O{background:#dcfce7;color:#166534}
.ex-answer.X{background:#fee2e2;color:#991b1b}
.nav-bar{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1.5px solid #e8ecf1;gap:8px}
.nav-btn{padding:10px 16px;border:none;border-radius:12px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;touch-action:manipulation}
.nav-btn.prev,.nav-btn.home{background:#f1f5f9;color:#374151;border:1.5px solid #e2e8f0}
.nav-btn.next{background:linear-gradient(135deg,#8b5cf6,#a78bfa);color:#fff}
.nav-btn:disabled{opacity:.3;cursor:default}
.set-list{display:grid;gap:10px;margin-top:8px}
.set-card{background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:16px 20px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .2s}
.set-card:hover{border-color:#8b5cf6;background:#faf5ff;transform:translateY(-2px)}
.set-card.done{border-color:#8b5cf6;background:linear-gradient(135deg,#faf5ff,#f3e8ff)}
.score-circle{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:16px auto;font-size:1.8rem;font-weight:800;border:6px solid}
.score-circle.pass{border-color:#10b981;color:#059669;background:linear-gradient(135deg,#ecfdf5,#d1fae5)}
.score-circle.fail{border-color:#f43f5e;color:#e11d48;background:linear-gradient(135deg,#fff1f2,#fecdd3)}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .15s ease-out}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}</style>

var CONFIG={"title":"중2기말_4과OX","passThreshold":97,"level":"low","levelLabel":"중2 수준 · CEFR A2-","passages":[{"id":1,"title":"Asking for Directions","body":"B: Excuse me. How can I get to Times Square?\nW: Pardon?\nB: I’m trying to find Times Square. Can you please help me?\nW: Ah, I got it. Go straight this way and turn left.\nB: Go straight this way and turn left?\nW: Right. You can’t miss it.\nB: Thank you so much.\nW: You’re welcome. Have a great time.\n"},{"id":2,"title":"Pretzel Line Conversation","body":"G: Excuse me. Why are you standing in line?\nM: Ah, I’m waiting to buy a pretzel.\nG: Pret... I beg your pardon?\nM: I said a pretzel. It is a salty type of bread with a unique shape.\nG: Oh, I see.\nM: It’s delicious. Give it a try!\nG: Okay. I'll join the line then. Thank you.\n"},{"id":3,"title":"Broadway Musical Plans","body":"W: Look! There are many musicals.\nM: Yeah. New York is famous for Broadway musicals.\nW: How about watching Cats? I heard the performances are amazing.\nM: That’s a great idea.\nW: Let’s check the show times and get tickets.\nM: Perfect. I can’t wait!\n"},{"id":4,"title":"New York Visit","body":"Mia: Ben, I can't believe we’re in New York!\nBen: Yeah. This is my first time here.\nMia: Me, too. There are many places to visit. Where should we start?\nBen: How about the Statue of Liberty?\nMia: Pardon?\nBen: The Statue of Liberty. You know the big green statue of a woman.\nMia: Of course. It’s a landmark of New York. Let's visit there first.\nBen: Good. After that, maybe we can go to the Empire State Building. It's famous for the fantastic view.\nMia: That sounds great!\n\n"},{"id":5,"title":"Australia Travel Advertisement","body":"Welcome back to our home shopping channel. Are you tired from the summer heat these days? We have the perfect solution for you, a trip to Australia! It's summer here in Korea, but it's winter in Australia now. This country is famous for its unique wild animals. Look! You'll meet these cute koalas. Then you'll also visit the famous Sydney Opera House, too. Don't miss this chance! Call us and book now. Winter in Australia is waiting for you."},{"id":6,"title":"Hawaiian Hula Dance","body":"**Hula, More than Just a Dance**\nAloha! Welcome to Hawaii! Aloha means \"hello\" or \"goodbye\" in the Hawaiian language. I'm Malia, and I'm your hula teacher for today. Have you heard of hula before? How much do you know about hula? Before we start our lesson, I want to tell you about it. Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time. The early Hawaiians didn't have a writing system, so they used hula to tell stories. Hula is a language through body movements, and it has passed down stories from one generation to the next. Now it's time to dance! Remember that you become a storyteller when you dance hula. You tell a story with your hands, feet, and hips. Oh, you need to take off your shoes and socks! Hula is always done barefoot. Let's start with the hand gestures. Every gesture in hula has a meaning. Wave your fingers while you move your arms up and down. This gesture is called *ua* in the Hawaiian language, and it means \"rain.\" What about the sun? Hawaiians make a circle with their arms above their heads. That's *ka lā*, the \"sun.\" These gestures are so simple that you can easily remember them. Next, bend your knees a little and step from side to side. While you step to the side, move your hips naturally. Now move your hands with your hips and feet! Well, time's up! That's all for today. Remember that hula is not just a dance. Hula is a language and a way of storytelling, so it is important to Hawaiians. As a hula teacher, I always try to continue the history and culture of Hawaii. If you want to learn more, come to my next class. Everyone is welcome. *Aloha!* \n"},{"id":7,"title":"Hula Dance Story","body":"The hula teacher, Malia, greets everyone with a warm \"Aloha!\" She introduces them to hula, a traditional dance from Hawaii. Long ago, Hawaiians used hula to tell stories because they didn't have a writing system. She explains that when they dance hula, they become storytellers. She asks students to take off their shoes and socks, because hula is done barefoot. She teaches them simple hand gestures: waving the fingers while moving the arms up and down means \"rain\" (ua), and making a circle with the arms above the head means the \"sun\" (ka lā). Next, Malia shows them how to bend their knees and step to the side while moving their hips. As the lesson ends, Malia says that hula is not just a dance. It is a language and a way of storytelling. She invites everyone to join her next class if they want to learn more.\n\n"}],"questions":[{"questionNumber":1,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"소년은 여자에게 Times Square까지 가는 길을 물어봤다.","answer":"O","explanation":"지문에서 소년(B)은 여자(W)에게 'How can I get to Times Square?'라고 묻고, 이어서 'I'm trying to find Times Square. Can you please help me?'라고 재차 도움을 요청했습니다. 따라서 소년이 여자에게 Times Square까지 가는 길을 물어봤다는 statement는 지문 내용과 완전히 일치합니다.","passageId":1,"passageTitle":"Asking for Directions","sourceSentence":null},{"questionNumber":2,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"여자는 소년에게 직진한 다음 오른쪽으로 꺾으라고 안내했다.","answer":"X","explanation":"지문에서 여자(W)는 'Go straight this way and turn left'라고 안내했습니다. 즉 직진 후 왼쪽으로 꺾으라고 했지만, statement는 '오른쪽으로 꺾으라고 했다'고 기술하고 있어 방향이 반대로 왜곡되었습니다.","passageId":1,"passageTitle":"Asking for Directions","sourceSentence":null},{"questionNumber":3,"type":"en_main","typeLabel":"전반 내용 (영어)","statement":"The boy understood the directions perfectly the first time the woman explained them.","answer":"X","explanation":"소년은 여자가 처음 길을 설명했을 때 바로 이해한 것이 아니라, 'Go straight this way and turn left?'라고 되물으며 방향을 다시 확인했습니다. 이는 소년이 완벽히 이해했다기보다 확인 차 반복한 것으로 볼 수 있습니다. 따라서 'perfectly the first time'이라는 표현은 지문 내용과 완전히 일치하지 않습니다.","passageId":1,"passageTitle":"Asking for Directions","sourceSentence":null},{"questionNumber":4,"type":"grammar","typeLabel":"문법 OX","statement":"You can't missing it.","answer":"X","explanation":"문장에서 'missing'은 문법적으로 잘못된 형태입니다. 'can't' 뒤에는 동사원형이 와야 하므로 'miss'를 사용해야 합니다. 올바른 표현은 지문에 나온 것처럼 'You can't miss it.'입니다.","passageId":1,"passageTitle":"Asking for Directions","sourceSentence":null},{"questionNumber":5,"type":"context_vocab","typeLabel":"문맥 어휘 OX","expression":"You can't miss it","contextSentence":"You can't miss it.","statement":"표현: You can't miss it → 그것을 놓치지 않을 수 없다 (즉, 쉽게 찾을 수 있다)","answer":"O","explanation":"\"You can't miss it\"은 직역하면 '그것을 놓칠 수 없다'이며, 관용적으로 '쉽게 찾을 수 있다'는 의미로 사용됩니다. 지문에서 W가 길 안내를 마친 후 이 표현을 사용한 것은 Times Square를 찾기 어렵지 않을 것이라고 확신시켜 주는 맥락입니다. 제시된 한글 의미인 '그것을 놓치지 않을 수 없다 (즉, 쉽게 찾을 수 있다)'는 이 맥락과 정확히 일치합니다.","passageId":1,"passageTitle":"Asking for Directions","sourceSentence":null},{"questionNumber":6,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"남자는 줄을 서서 프레첼을 사려고 기다리고 있었다.","answer":"O","explanation":"지문에서 남자는 'I'm waiting to buy a pretzel'이라고 직접 말하고 있습니다. 따라서 남자가 줄을 서서 프레첼을 사려고 기다리고 있었다는 statement는 지문 내용과 완전히 일치합니다.","passageId":2,"passageTitle":"Pretzel Line Conversation","sourceSentence":null},{"questionNumber":7,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"남자는 프레첼이 단맛이 나는 빵이라고 설명했다.","answer":"X","explanation":"지문에서 남자는 프레첼을 'a salty type of bread(짭짤한 종류의 빵)'라고 설명했다. 그러나 statement에서는 '단맛이 나는 빵'이라고 했으므로, 맛의 표현이 정반대로 왜곡되어 있다. 따라서 statement는 틀렸다.","passageId":2,"passageTitle":"Pretzel Line Conversation","sourceSentence":null},{"questionNumber":8,"type":"en_main","typeLabel":"전반 내용 (영어)","statement":"The girl decided to leave the line after hearing about pretzels.","answer":"X","explanation":"지문에서 소녀(G)는 프레첼에 대한 설명을 듣고 줄을 떠난 것이 아니라, 오히려 줄에 합류하겠다고('I'll join the line then') 말했습니다. Statement는 소녀가 줄을 떠났다고 했으므로 지문 내용과 정반대입니다.","passageId":2,"passageTitle":"Pretzel Line Conversation","sourceSentence":null},{"questionNumber":9,"type":"grammar","typeLabel":"문법 OX","statement":"It is a salty type of bread with a unique shape.","answer":"O","explanation":"이 문장은 문법적으로 완전히 올바릅니다. 주어 'It'에 맞춰 동사 'is'가 단수 형태로 수일치되었고, 'a salty type of bread'에서 관사와 명사 사용이 적절합니다. 'with a unique shape'도 전치사 'with'를 올바르게 사용한 전치사구로, 명사를 수식하는 문법적으로 문제없는 구조입니다.","passageId":2,"passageTitle":"Pretzel Line Conversation","sourceSentence":null},{"questionNumber":10,"type":"context_vocab","typeLabel":"문맥 어휘 OX","expression":"Give it a try","contextSentence":"It's delicious. Give it a try!","statement":"표현: Give it a try → 한번 먹어보다","answer":"O","explanation":"'Give it a try'는 '한번 해보다/시도해보다'라는 의미의 표현입니다. 이 지문에서 M이 프레첼을 맛있다고 소개하며 G에게 'Give it a try!'라고 말하는 맥락에서, 이는 '한번 먹어보다'라는 의미로 자연스럽게 사용되었습니다. 따라서 제시된 한글 의미는 지문 맥락과 일치합니다.","passageId":2,"passageTitle":"Pretzel Line Conversation","sourceSentence":null},{"questionNumber":11,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"두 사람은 뉴욕에서 뮤지컬을 보려고 공연 시간을 확인하기로 했다.","answer":"O","explanation":"두 사람은 뉴욕에서 브로드웨이 뮤지컬을 관람하려는 상황이며, 여자가 '공연 시간을 확인하고 티켓을 구하자(Let's check the show times and get tickets)'고 제안했고 남자도 동의했다. 따라서 뉴욕에서 뮤지컬을 보기 위해 공연 시간을 확인하기로 했다는 진술은 지문 내용과 완전히 일치한다.","passageId":3,"passageTitle":"Broadway Musical Plans","sourceSentence":null},{"questionNumber":12,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"여자는 'Cats' 뮤지컬의 배우들이 유명하다고 들었다고 말했다.","answer":"X","explanation":"여자는 'Cats' 뮤지컬에 대해 'the performances are amazing'(공연이 놀랍다)고 들었다고 말했다. Statement에서는 '배우들이 유명하다'고 했으나, 지문에는 배우(actors/performers)의 유명세가 아닌 공연(performances) 자체가 훌륭하다는 내용이 언급되었다. 핵심 단어가 왜곡되었으므로 X이다.","passageId":3,"passageTitle":"Broadway Musical Plans","sourceSentence":null},{"questionNumber":13,"type":"en_main","typeLabel":"전반 내용 (영어)","statement":"The woman suggested watching Cats because New York is known for Broadway musicals.","answer":"X","explanation":"여성이 Cats 관람을 제안한 이유는 '공연이 놀랍다고 들었기 때문(I heard the performances are amazing)'이다. 뉴욕이 브로드웨이 뮤지컬로 유명하다는 말은 남성이 한 발언으로, Cats 제안의 직접적인 이유가 아니다. statement는 제안의 원인을 잘못 연결하고 있으므로 X이다.","passageId":3,"passageTitle":"Broadway Musical Plans","sourceSentence":null},{"questionNumber":14,"type":"grammar","typeLabel":"문법 OX","statement":"New York is famous for Broadway musicals.","answer":"O","explanation":"이 문장은 문법적으로 완전히 올바릅니다. 'be famous for'는 '~로 유명하다'를 뜻하는 관용 표현으로 전치사 for가 적절하게 사용되었으며, 주어 'New York'에 맞게 단수 동사 'is'가 올바르게 쓰였습니다. 시제, 관사, 수일치 등 모든 문법 요소에 오류가 없습니다.","passageId":3,"passageTitle":"Broadway Musical Plans","sourceSentence":null},{"questionNumber":15,"type":"context_vocab","typeLabel":"문맥 어휘 OX","expression":"I can't wait","contextSentence":"Perfect. I can't wait!","statement":"표현: I can't wait → 더 이상 기다릴 시간이 없다","answer":"X","explanation":"지문에서 'I can't wait!'는 뮤지컬 관람을 너무 기대하고 설레어 '빨리 보고 싶다'는 의미의 관용 표현입니다. 제시된 한글 의미 '더 이상 기다릴 시간이 없다'는 시간적 촉박함을 나타내는 문자적 해석으로, 실제 맥락과 다릅니다. 올바른 의미는 '너무 기대된다, 빨리 하고 싶다'입니다.","passageId":3,"passageTitle":"Broadway Musical Plans","sourceSentence":null},{"questionNumber":16,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"Mia와 Ben은 둘 다 뉴욕에 처음 방문한 것이다.","answer":"O","explanation":"Ben은 'This is my first time here.'라고 말하며 뉴욕이 처음임을 밝혔고, Mia도 'Me, too.'라고 응답하여 자신도 처음임을 확인했다. 따라서 두 사람 모두 뉴욕에 처음 방문한 것이 맞으므로 statement는 지문과 완전히 일치한다.","passageId":4,"passageTitle":"New York Visit","sourceSentence":null},{"questionNumber":17,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"Ben은 자유의 여신상을 파란색의 여성 동상이라고 설명했다.","answer":"X","explanation":"Ben은 자유의 여신상을 '큰 초록색 여성 동상(the big green statue of a woman)'이라고 설명했다. Statement에서는 '파란색'이라고 했으나, 실제 지문에서는 'green(초록색)'이라고 명시되어 있으므로 색상 정보가 잘못되었다.","passageId":4,"passageTitle":"New York Visit","sourceSentence":null},{"questionNumber":18,"type":"en_main","typeLabel":"전반 내용 (영어)","statement":"Mia suggested visiting the Statue of Liberty first.","answer":"X","explanation":"자유의 여신상을 먼저 방문하자고 제안한 사람은 Mia가 아니라 Ben이다. Ben이 'How about the Statue of Liberty?'라고 제안했고, Mia는 그에 동의하며 'Let's visit there first.'라고 말했다. 따라서 제안의 주체가 잘못 기술된 statement이므로 X이다.","passageId":4,"passageTitle":"New York Visit","sourceSentence":null},{"questionNumber":19,"type":"en_main","typeLabel":"전반 내용 (영어)","statement":"Ben said the Empire State Building is known for its wonderful view.","answer":"O","explanation":"지문에서 Ben은 'It's famous for the fantastic view'라고 말하며 Empire State Building을 언급했다. Statement에서 'known for its wonderful view'는 'famous for the fantastic view'와 동일한 의미로, 내용상 완전히 일치한다.","passageId":4,"passageTitle":"New York Visit","sourceSentence":null},{"questionNumber":20,"type":"grammar","typeLabel":"문법 OX","statement":"There are many places to visiting in New York.","answer":"X","explanation":"'to visiting'은 문법적으로 잘못된 표현입니다. 'to' 뒤에는 동사원형이 와야 하므로 'to visit'이 올바른 형태입니다. 지문에서도 'There are many places to visit'라고 표현하고 있습니다.","passageId":4,"passageTitle":"New York Visit","sourceSentence":null},{"questionNumber":21,"type":"grammar","typeLabel":"문법 OX","statement":"The Statue of Liberty is a landmark of New York.","answer":"O","explanation":"이 문장은 문법적으로 완전히 올바릅니다. 주어 'The Statue of Liberty'는 단수이며 동사 'is'와 수일치가 맞고, 'a landmark'에 부정관사 'a'가 적절하게 사용되었습니다. 전치사 'of' 역시 '~의 랜드마크'라는 의미로 올바르게 쓰였으며, 지문에서 Mia의 대사('It's a landmark of New York.')와도 일치합니다.","passageId":4,"passageTitle":"New York Visit","sourceSentence":null},{"questionNumber":22,"type":"context_vocab","typeLabel":"문맥 어휘 OX","expression":"landmark","contextSentence":"It's a landmark of New York.","statement":"표현: landmark → 그 지역을 대표하는 유명한 건축물이나 장소","answer":"O","explanation":"지문에서 Mia는 'It's a landmark of New York'이라고 말하며 자유의 여신상을 뉴욕을 대표하는 상징적인 장소로 표현하고 있습니다. 이 맥락에서 'landmark'는 '그 지역을 대표하는 유명한 건축물이나 장소'라는 의미로 사용되고 있어 제시된 한글 의미와 정확히 일치합니다.","passageId":4,"passageTitle":"New York Visit","sourceSentence":null},{"questionNumber":23,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"광고에서 호주 여행을 권유하는 이유 중 하나는 한국이 여름일 때 호주는 겨울이기 때문이다.","answer":"O","explanation":"지문에서 'It's summer here in Korea, but it's winter in Australia now'라고 명시하며 호주 여행을 권유하고 있다. 즉, 한국이 여름일 때 호주는 겨울이라는 사실이 여행을 추천하는 이유 중 하나로 제시되어 있으므로 statement는 지문 내용과 완전히 일치한다.","passageId":5,"passageTitle":"Australia Travel Advertisement","sourceSentence":null},{"questionNumber":24,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"이 광고에서 방문할 수 있다고 소개된 유명 건축물은 시드니 오페라 하우스가 아니라 시드니 하버 브리지이다.","answer":"X","explanation":"지문에서는 'the famous Sydney Opera House'를 방문한다고 명시되어 있습니다. Statement는 방문 건축물이 '시드니 하버 브리지'라고 주장하지만, 이는 지문 내용과 다릅니다. 따라서 해당 statement는 틀렸습니다.","passageId":5,"passageTitle":"Australia Travel Advertisement","sourceSentence":null},{"questionNumber":25,"type":"en_main","typeLabel":"전반 내용 (영어)","statement":"This advertisement says Australia is known for its unusual wild animals.","answer":"O","explanation":"지문에서 'This country is famous for its unique wild animals'라고 언급하고 있으며, statement의 'unusual wild animals'는 'unique wild animals'와 동일한 의미로 볼 수 있습니다. 호주가 독특한(unusual/unique) 야생 동물로 유명하다는 내용이 지문과 일치하므로 O입니다.","passageId":5,"passageTitle":"Australia Travel Advertisement","sourceSentence":null},{"questionNumber":26,"type":"grammar","typeLabel":"문법 OX","statement":"You will also visit the famous Sydney Opera House, too.","answer":"X","explanation":"'also'와 'too'는 같은 의미의 부사로, 한 문장에 함께 사용하면 중복 표현(redundancy) 오류가 됩니다. 'You will also visit the famous Sydney Opera House.' 또는 'You will visit the famous Sydney Opera House, too.' 중 하나만 사용하는 것이 문법적으로 올바릅니다.","passageId":5,"passageTitle":"Australia Travel Advertisement","sourceSentence":null},{"questionNumber":27,"type":"context_vocab","typeLabel":"문맥 어휘 OX","expression":"book now","contextSentence":"Call us and book now.","statement":"표현: book now → 지금 바로 예약하다","answer":"O","explanation":"지문에서 'Call us and book now'는 홈쇼핑 채널에서 시청자에게 전화해서 여행을 예약하라고 촉구하는 표현입니다. 이 맥락에서 'book'은 '예약하다'라는 의미로 사용되었으며, 'book now'는 '지금 바로 예약하다'로 해석하는 것이 적절합니다. 따라서 제시된 한글 의미는 지문의 맥락과 정확히 일치합니다.","passageId":5,"passageTitle":"Australia Travel Advertisement","sourceSentence":null},{"questionNumber":28,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"말리아(Malia)에 따르면, 훌라는 하와이의 전통 춤으로서 하와이 사람들의 삶에서 오랫동안 중요한 역할을 해왔다.","answer":"O","explanation":"지문에서 말리아는 'Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time.'이라고 직접 언급하고 있다. 이는 훌라가 하와이의 전통 춤이며 오랫동안 하와이 사람들의 삶의 일부였다는 statement의 내용과 완전히 일치한다.","passageId":6,"passageTitle":"Hawaiian Hula Dance","sourceSentence":null},{"questionNumber":29,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"초기 하와이 사람들은 문자 체계가 없었기 때문에, 훌라를 이용해 역사를 기록했다.","answer":"X","explanation":"지문에서 초기 하와이 사람들은 문자 체계가 없었기 때문에 훌라를 이용해 '이야기를 전했다(to tell stories)'고 설명하고 있습니다. statement는 '역사를 기록했다'고 표현했지만, 지문의 표현은 '이야기를 전하고 다음 세대로 이야기를 전달했다'는 의미로, '역사를 기록'한다는 표현과는 다릅니다. 인과관계의 원인(문자 체계 없음)은 일치하지만, 결과 표현('역사 기록' vs '이야기 전달')이 지문과 정확히 일치하지 않으므로 X입니다.","passageId":6,"passageTitle":"Hawaiian Hula Dance","sourceSentence":null},{"questionNumber":30,"type":"en_main","typeLabel":"전반 내용 (영어)","statement":"Hula is a form of storytelling that passed down stories from one generation to the next through body movements.","answer":"O","explanation":"지문에서 'Hula is a language through body movements, and it has passed down stories from one generation to the next.'라고 명시되어 있습니다. 또한 초기 하와이인들이 문자 체계가 없었기 때문에 훌라를 통해 이야기를 전달했다고 설명하므로, 훌라가 신체 동작을 통해 세대에서 세대로 이야기를 전달하는 스토리텔링 방식이라는 statement의 내용은 지문과 완전히 일치합니다.","passageId":6,"passageTitle":"Hawaiian Hula Dance","sourceSentence":null},{"questionNumber":31,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"훌라를 출 때 신발만 벗으면 되고, 양말은 신어도 괜찮다.","answer":"X","explanation":"지문에서 '훌라는 항상 맨발로 춘다(Hula is always done barefoot)'고 명시되어 있으며, 강사는 신발과 양말 모두 벗으라고 했습니다. 따라서 양말은 신어도 된다는 진술은 지문 내용과 다릅니다.","passageId":6,"passageTitle":"Hawaiian Hula Dance","sourceSentence":null},{"questionNumber":32,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"하와이어로 'ua'는 손동작으로 비를 표현한 것이며, 팔을 위아래로 움직이면서 손가락을 흔드는 동작이다.","answer":"O","explanation":"지문에서 'ua'는 하와이어로 '비(rain)'를 의미하며, 팔을 위아래로 움직이면서 손가락을 흔드는 동작이라고 설명되어 있다. statement는 이 내용을 정확히 반영하고 있으므로 올바르다.","passageId":6,"passageTitle":"Hawaiian Hula Dance","sourceSentence":null},{"questionNumber":33,"type":"en_main","typeLabel":"전반 내용 (영어)","statement":"To show the sun in hula, Hawaiians place their hands on their hips and form a circle.","answer":"X","explanation":"지문에 따르면 태양을 표현할 때 하와이인들은 '팔을 머리 위에서 원을 만든다(make a circle with their arms above their heads)'고 설명하고 있습니다. Statement에서는 손을 엉덩이에 올려 원을 만든다고 했으나, 이는 지문의 내용과 다릅니다. 원을 만드는 위치가 '머리 위'가 아닌 '엉덩이'로 잘못 서술되어 있으므로 X입니다.","passageId":6,"passageTitle":"Hawaiian Hula Dance","sourceSentence":null},{"questionNumber":34,"type":"context_vocab","typeLabel":"문맥 어휘 OX","expression":"passed down","contextSentence":"Hula is a language through body movements, and it has passed down stories from one generation to the next.","statement":"표현: passed down → (이야기·전통 등을) 후세에 전해 내려오다","answer":"O","explanation":"지문에서 'it has passed down stories from one generation to the next'라는 문장이 등장하며, 여기서 'passed down'은 '이야기를 한 세대에서 다음 세대로 전해 내려오다'는 의미로 사용되었습니다. 제시된 한글 의미 '(이야기·전통 등을) 후세에 전해 내려오다'는 이 맥락과 정확히 일치합니다. 따라서 해당 표현의 의미 설명은 올바릅니다.","passageId":6,"passageTitle":"Hawaiian Hula Dance","sourceSentence":null},{"questionNumber":35,"type":"context_vocab","typeLabel":"문맥 어휘 OX","expression":"barefoot","contextSentence":"Hula is always done barefoot.","statement":"표현: barefoot → 맨손으로","answer":"X","explanation":"지문에서 'barefoot'은 \"Hula is always done barefoot\"이라는 문장에 등장하며, 신발과 양말을 벗고 맨발로 춤을 춘다는 맥락에서 쓰였습니다. 따라서 'barefoot'의 올바른 의미는 '맨발로'이며, 제시된 '맨손으로'는 손(hand)과 관련된 잘못된 해석입니다.","passageId":6,"passageTitle":"Hawaiian Hula Dance","sourceSentence":null},{"questionNumber":36,"type":"context_vocab","typeLabel":"문맥 어휘 OX","expression":"continue","contextSentence":"As a hula teacher, I always try to continue the history and culture of Hawaii.","statement":"표현: continue → (하와이의 역사와 문화를) 이어나가다","answer":"O","explanation":"지문 마지막 부분에서 화자인 Malia는 'I always try to continue the history and culture of Hawaii'라고 말하고 있습니다. 여기서 'continue'는 하와이의 역사와 문화를 끊기지 않게 '이어나가다'라는 의미로 사용되었습니다. 제시된 한글 의미와 지문 맥락이 정확히 일치하므로 O입니다.","passageId":6,"passageTitle":"Hawaiian Hula Dance","sourceSentence":null},{"questionNumber":37,"type":"grammar","typeLabel":"문법 OX","statement":"Every gesture in hula have a meaning.","answer":"X","explanation":"주어 'Every gesture'는 단수 취급을 받으므로 동사는 'have'가 아닌 'has'가 되어야 합니다. 'Every + 단수명사'는 항상 단수 동사와 함께 사용되는 문법 규칙이 있으며, 지문 원문도 'Every gesture in hula has a meaning.'으로 표현되어 있습니다.","passageId":6,"passageTitle":"Hawaiian Hula Dance","sourceSentence":null},{"questionNumber":38,"type":"grammar","typeLabel":"문법 OX","statement":"The early Hawaiians didn't have a writing system, so they used hula to telling stories.","answer":"X","explanation":"'to telling'은 문법적으로 틀린 표현입니다. 'used'와 함께 목적을 나타낼 때는 'to + 동사원형'인 to부정사를 써야 하므로 'to tell'이 올바른 형태입니다. 원문에서도 'they used hula to tell stories'로 표현되어 있습니다.","passageId":6,"passageTitle":"Hawaiian Hula Dance","sourceSentence":null},{"questionNumber":39,"type":"en_main","typeLabel":"전반 내용 (영어)","statement":"In hula, the dancer tells a story only with hand gestures, without using feet or hips.","answer":"X","explanation":"지문에서 훌라를 출 때 손뿐만 아니라 발과 엉덩이도 함께 사용하여 이야기를 전달한다고 명시되어 있습니다. 구체적으로 'You tell a story with your hands, feet, and hips.'라고 언급되어 있으므로, 손짓만으로 이야기를 전한다는 statement는 사실과 다릅니다.","passageId":6,"passageTitle":"Hawaiian Hula Dance","sourceSentence":null},{"questionNumber":40,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"말리아는 다음 수업에 오는 것을 환영하지만, 사전에 등록한 사람만 참여할 수 있다고 했다.","answer":"X","explanation":"지문에서 말리아는 'If you want to learn more, come to my next class. Everyone is welcome.'라고 말하며 다음 수업에 누구나 환영한다고 했다. 사전 등록한 사람만 참여할 수 있다는 내용은 지문에 전혀 언급되지 않은 거짓 정보이다.","passageId":6,"passageTitle":"Hawaiian Hula Dance","sourceSentence":null},{"questionNumber":41,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"말리아는 수업 시작 시 학생들에게 'Aloha!'라고 인사하며 하울라를 소개했다.","answer":"X","explanation":"지문에서 말리아는 'Aloha!'라고 인사하며 hula(훌라)를 소개했다고 나와 있습니다. 그러나 statement에는 'hula'를 '하울라'로 잘못 표기하였으므로 X입니다. '훌라'와 '하울라'는 다른 표현이며, 지문의 내용과 정확히 일치하지 않습니다.","passageId":7,"passageTitle":"Hula Dance Story","sourceSentence":null},{"questionNumber":42,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"오래전 하와이 사람들은 문자 체계가 없었기 때문에 훌라를 이용해 역사를 기록했다.","answer":"X","explanation":"지문에서 하와이 사람들이 훌라를 사용한 목적은 '역사를 기록하기 위해서'가 아니라 '이야기를 전하기 위해서(to tell stories)'라고 명시되어 있습니다. '역사 기록'과 '이야기 전달'은 다른 개념이므로 statement는 지문과 일치하지 않습니다.","passageId":7,"passageTitle":"Hula Dance Story","sourceSentence":null},{"questionNumber":43,"type":"ko_detail","typeLabel":"부분 내용 (한글)","statement":"말리아는 학생들에게 훌라를 출 때 맨발로 해야 하기 때문에 신발과 양말을 벗으라고 했다.","answer":"O","explanation":"지문에서 말리아는 '훌라는 맨발로 추는 춤이기 때문에 신발과 양말을 벗으라(take off their shoes and socks, because hula is done barefoot)'고 요청했습니다. statement는 이 내용을 정확히 반영하고 있으며, 원인(맨발로 해야 함)과 결과(신발·양말을 벗으라는 요청)의 방향도 지문과 일치합니다.","passageId":7,"passageTitle":"Hula Dance Story","sourceSentence":null},{"questionNumber":44,"type":"en_main","typeLabel":"전반 내용 (영어)","statement":"In hula, waving fingers while moving arms up and down represents the sun.","answer":"X","explanation":"지문에 따르면 손가락을 흔들며 팔을 위아래로 움직이는 동작은 '비(ua)'를 의미한다. '태양(ka lā)'은 팔로 머리 위에 원을 만드는 동작으로 표현된다. 따라서 statement는 두 동작의 의미를 서로 바꿔 설명하고 있으므로 틀렸다.","passageId":7,"passageTitle":"Hula Dance Story","sourceSentence":null},{"questionNumber":45,"type":"en_main","typeLabel":"전반 내용 (영어)","statement":"Malia describes hula as not just a dance, but a language and a way of storytelling.","answer":"O","explanation":"지문 마지막 부분에서 Malia는 'hula is not just a dance. It is a language and a way of storytelling.'이라고 말하며, statement의 내용과 정확히 일치한다. 표현 방식도 지문의 내용을 충실히 반영하고 있으므로 O로 판정한다.","passageId":7,"passageTitle":"Hula Dance Story","sourceSentence":null},{"questionNumber":46,"type":"grammar","typeLabel":"문법 OX","statement":"She explains that when they dance hula, they become storytellers.","answer":"O","explanation":"이 문장은 문법적으로 완전히 올바릅니다. 'explains that' 뒤에 접속사 'when'이 이끄는 부사절과 주절이 바르게 연결되어 있으며, 시제와 수 일치 모두 정확합니다.","passageId":7,"passageTitle":"Hula Dance Story","sourceSentence":null},{"questionNumber":47,"type":"context_vocab","typeLabel":"문맥 어휘 OX","expression":"take off","contextSentence":"She asks students to take off their shoes and socks, because hula is done barefoot.","statement":"표현: take off → (옷·신발 등을) 벗다","answer":"O","explanation":"이 문장에서 'take off'는 신발과 양말을 '벗다'는 의미로 쓰였습니다. 'take off'는 '이륙하다'나 '떠나다'라는 뜻도 있지만, 여기서는 신발을 몸에서 분리하는 맥락이므로 '벗다'가 정확한 해석입니다.","passageId":7,"passageTitle":"Hula Dance Story","sourceSentence":null}]};
var QS=CONFIG.questions||[];
var TOTAL=QS.length;
var SET_SIZE=10;
var SETS=(function(){var s=[];for(var i=0;i<TOTAL;i+=SET_SIZE)s.push(QS.slice(i,i+SET_SIZE));return s;})();
var answers={};var currentSet=0;
function esc(s){if(s==null)return"";var d=document.createElement("div");d.textContent=String(s);return d.innerHTML}
function setH(t,sub){var h=document.getElementById("hTitle");var p=document.getElementById("hSub");if(h)h.textContent=t;if(p)p.textContent=sub}
function gi(si,pi){return si*SET_SIZE+pi}
function showIndex(){
  setH(CONFIG.title,"OX 문제 테스트");
  var chips=SETS.map(function(sq,si){
    var base=si*SET_SIZE;var done=0,correct=0;
    for(var i=0;i<sq.length;i++){var a=answers[base+i];if(a){done++;if(a.isCorrect)correct++;}}
    var allDone=(done===sq.length);
    var pct=done>0?Math.round(correct/sq.length*100):null;
    var passed=pct!==null&&pct>=CONFIG.passThreshold;
    var scoreHTML=pct===null
      ?"<span style='font-size:.78rem;color:#9ca3af'>미응시</span>"
      :(allDone?"<span style='font-weight:700;color:"+(passed?"#10b981":"#ef4444")+"'>"+(passed?"✅ ":"❌ ")+pct+"%</span>"
             :"<span style='font-weight:700;color:#8b5cf6'>📝 "+done+"/"+sq.length+"</span>");
    return "<div class='set-card"+(allDone?" done":"")+"' onclick='enterSet("+si+")'>"
           +"<div><div style='font-weight:700'>세트 "+(si+1)+" <span style='font-size:.8rem;color:#6b7280;font-weight:400'>("+sq.length+"문제)</span></div></div>"
           +"<div>"+scoreHTML+"</div></div>";
  }).join("");
  var app=document.getElementById("app");if(!app)return;
  app.innerHTML="<div class='fade' style='text-align:center;padding:16px 0'>"
    +"<div style='font-size:2.5rem;margin-bottom:8px'>📱</div>"
    +"<h2 style='font-size:1.2rem;font-weight:700;color:#1f2937;margin-bottom:4px'>OX 문제 테스트</h2>"
    +"<p style='color:#6b7280;font-size:.85rem;margin-bottom:16px'>전체 "+TOTAL+"문제 · "+CONFIG.passThreshold+"% 이상 통과 · 몰라요는 오답 처리</p>"
    +"</div><div class='set-list'>"+chips+"</div>";
}
function enterSet(si){currentSet=si;showQ(0)}
function showQ(pos){
  try{window.scrollTo(0,0)}catch(e){}
  var si=currentSet;var qs=SETS[si];
  if(!qs||pos<0||pos>=qs.length){showIndex();return;}
  var gidx=gi(si,pos);var q=qs[pos];var answered=answers[gidx];
  setH("세트 "+(si+1),"문제 "+(pos+1)+"/"+qs.length);
  var pct=Math.round((pos+1)/qs.length*100);
  function btnClass(which){
    if(!answered)return "ox-btn "+which;
    if(answered.picked===which){
      if(which==="dunno")return "ox-btn dunno sel dunno wrong";
      return "ox-btn "+which+" "+(answered.isCorrect?"correct":"wrong");
    }
    return "ox-btn "+which;
  }
  var sourceHTML="";
  // 학생용 HTML — 원본 지문 미표시
  var fbHTML="";
  if(answered){
    var cls=answered.picked==="dunno"?"dunno":(answered.isCorrect?"ok":"ng");
    var msg=answered.picked==="dunno"?"🤔 몰라요 — 해설을 학습하세요":(answered.isCorrect?"✅ 정답!":"❌ 오답");
    fbHTML="<div class='fb "+cls+"'>"+msg+"</div>"
      +"<div class='explain-box'><div class='ex-title'>📖 정답 & 해설</div>"
      +"<div class='ex-body'><span class='ex-answer "+q.answer+"'>"+q.answer+"</span>"+(q.explanation?esc(q.explanation):"해설이 없습니다.")+"</div></div>";
  }
  var app=document.getElementById("app");if(!app)return;
  app.innerHTML="<div class='fade'>"
    +"<div class='q-counter'>"+(pos+1)+" / "+qs.length+"</div>"
    +"<div class='prog-bar'><div class='prog-fill' style='width:"+pct+"%'></div></div>"
    +"<div class='title-box'><div class='ptitle'>"+esc(q.passageTitle)+"</div>"
    +"<span class='tlabel'>"+esc(q.typeLabel||"")+"</span></div>"
    +"<div class='statement'>"+esc(q.statement)+"</div>"
    +sourceHTML
    +"<div class='ox-grid'>"
    +"<button class='"+btnClass("o")+"' onclick='pick("+pos+",&quot;o&quot;)' "+(answered?"disabled":"")+"><span class='ox-icon'>⭕</span>O (맞음)</button>"
    +"<button class='"+btnClass("x")+"' onclick='pick("+pos+",&quot;x&quot;)' "+(answered?"disabled":"")+"><span class='ox-icon'>❌</span>X (틀림)</button>"
    +"<button class='"+btnClass("dunno")+"' onclick='pick("+pos+",&quot;dunno&quot;)' "+(answered?"disabled":"")+">🤔 몰라요 (정답·해설 보기)</button>"
    +"</div>"
    +fbHTML
    +"<div class='nav-bar'>"
    +"<button class='nav-btn prev' onclick='showQ("+(pos-1)+")' "+(pos<=0?"disabled":"")+">← 이전</button>"
    +"<button class='nav-btn home' onclick='showIndex()'>목록</button>"
    +"<button class='nav-btn next' onclick='"+(pos<qs.length-1?"showQ("+(pos+1)+")":"showSetResult()")+"'>"+(pos<qs.length-1?"다음 →":"결과")+"</button>"
    +"</div></div>";
}
function pick(pos,which){
  var gidx=gi(currentSet,pos);
  if(answers[gidx])return;
  var q=SETS[currentSet][pos];
  var isCorrect=false;
  if(which==="dunno"){isCorrect=false;}
  else{isCorrect=(which==="o"&&q.answer==="O")||(which==="x"&&q.answer==="X");}
  answers[gidx]={picked:which,isCorrect:isCorrect};
  showQ(pos);
}
function showSetResult(){
  var si=currentSet;var qs=SETS[si];var base=si*SET_SIZE;
  var total=qs.length;var correct=0,dunno=0;
  for(var i=0;i<total;i++){var a=answers[base+i];if(a&&a.isCorrect)correct++;if(a&&a.picked==="dunno")dunno++;}
  var pct=Math.round(correct/total*100);var passed=pct>=CONFIG.passThreshold;
  setH("세트 "+(si+1)+" 결과",passed?"통과":"미달");
  var app=document.getElementById("app");if(!app)return;
  app.innerHTML="<div class='fade' style='text-align:center;padding:16px 0'>"
    +"<div class='score-circle "+(passed?"pass":"fail")+"'>"+pct+"%</div>"
    +"<p style='font-size:1.1rem;font-weight:700;color:"+(passed?"#10b981":"#ef4444")+"'>"+(passed?"통과!":"미달")+"</p>"
    +"<p style='color:#6b7280;font-size:.88rem;margin-top:8px'>"+correct+"/"+total+"문제 정답 · 몰라요 "+dunno+"개 · 기준 "+CONFIG.passThreshold+"%</p>"
    +"</div>"
    +"<div style='margin-top:16px'><button class='nav-btn next' style='width:100%;padding:14px' onclick='showIndex()'>목록으로</button></div>";
}
try{history.pushState(null,"",location.href);
window.addEventListener("popstate",function(){history.pushState(null,"",location.href);showIndex();});}catch(e){}
showIndex();
</script>
